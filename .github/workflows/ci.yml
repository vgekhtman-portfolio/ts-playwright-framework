name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Typecheck, lint, format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format:check

  test:
    name: Test (${{ matrix.project }})
    needs: lint
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      # The shared public backend misattributes requests under concurrent
      # load (see playwright.config.ts), so matrix jobs run one at a time
      # rather than GitHub's default of all-at-once.
      max-parallel: 1
      matrix:
        project: ${{ github.event_name == 'pull_request' && fromJSON('["chromium", "api"]') || fromJSON('["chromium", "firefox", "webkit", "api"]') }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browser
        if: matrix.project != 'api'
        run: npx playwright install --with-deps ${{ matrix.project }}

      - name: Run tests
        run: npx playwright test --project=${{ matrix.project }}

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-${{ matrix.project }}
          path: playwright-report
          if-no-files-found: warn

      - name: Upload Allure results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: allure-results-${{ matrix.project }}
          path: allure-results
          if-no-files-found: warn

  allure-report:
    name: Combined Allure report
    needs: test
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Download all Allure results
        uses: actions/download-artifact@v8
        with:
          pattern: allure-results-*
          path: allure-results
          merge-multiple: true

      - name: Fetch previous report history (for trend graphs)
        run: |
          mkdir -p allure-results/history
          for f in history.json history-trend.json categories-trend.json duration-trend.json retry-trend.json; do
            curl -sf "https://vgekhtman-portfolio.github.io/ts-playwright-framework/history/$f" \
              -o "allure-results/history/$f" || true
          done

      - name: Generate combined report
        run: npx allure generate allure-results --clean -o allure-report

      - name: Upload report for Pages
        uses: actions/upload-pages-artifact@v5
        with:
          path: allure-report

  deploy-pages:
    name: Deploy Allure report to Pages
    needs: allure-report
    # A pull_request run builds from a synthetic merge commit, which the
    # github-pages environment's branch protection rejects, so only deploy
    # on push events. Scoped to main specifically: the github-pages
    # environment only allows deploying from main anyway, and the public
    # report should reflect the stable branch, not in-progress develop.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
